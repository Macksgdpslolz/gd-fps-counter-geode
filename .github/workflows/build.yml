name: Build Geode Mod
on: [push, workflow_dispatch]
jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android64
            os: ubuntu-latest
            target: android64
          - name: Android32
            os: ubuntu-latest
            target: android32
    steps:
      - uses: actions/checkout@v4
      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
          sdk: v6.0.0-alpha.2
          cli: latest
          combine: true

  combine:
    name: Combine Android packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Combine .geode packages
        uses: geode-sdk/build-geode-mod/combine@main
      - name: Upload combined mod
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod
          path: "*.geode"
